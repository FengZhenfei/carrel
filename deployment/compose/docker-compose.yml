# Carrel infrastructure: the parser (MinerU), the three stores (Qdrant,
# OpenSearch, Neo4j) and, behind the `local-models` profile, five vLLM model
# servers for people who want embeddings / rerankers / the vision model on the
# same box instead of a hosted API.
#
# Every host path below is relative to this directory, so data lands under
# <repo>/runtime and weights under <repo>/models wherever the repo is checked
# out. `deploy.sh` at the repo root writes the `.env` next to this file
# (GPU or CPU, registry mirror, memory tier, Neo4j password); run it instead of
# editing defaults here. `compose.gpu.yml` adds the GPU reservation for MinerU
# and is included through COMPOSE_FILE in that `.env`.
name: carrel

x-vllm-common: &vllm-common
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.21.0}
  restart: unless-stopped
  ipc: host
  gpus: all
  profiles: ["local-models"]
  environment:
    VLLM_USE_DEEP_GEMM: "${VLLM_USE_DEEP_GEMM:-0}"
  networks:
    - carrel

x-vllm-healthcheck: &vllm-healthcheck
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 180s

services:
  # ── optional local model servers (profile: local-models) ─────────────────
  embedding:
    <<: *vllm-common
    container_name: carrel-embedding
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${QWEN3_EMBEDDING_PORT:-8101}:8000"
    volumes:
      - "${QWEN3_EMBEDDING_MODEL_PATH:-../../models/Qwen3-Embedding-0.6B}:/models/Qwen3-Embedding-0.6B:ro"
    command:
      - vllm
      - serve
      - /models/Qwen3-Embedding-0.6B
      - --served-model-name
      - qwen3-embedding-0.6b
      - --runner
      - pooling
      - --convert
      - embed
      - --hf-overrides
      - '{"is_matryoshka":true}'
      - --dtype
      - "${QWEN3_EMBEDDING_DTYPE:-bfloat16}"
      - --gpu-memory-utilization
      - "${QWEN3_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.05}"
      - --max-model-len
      - "${QWEN3_EMBEDDING_MAX_MODEL_LEN:-4096}"
      - --max-num-seqs
      - "${QWEN3_EMBEDDING_MAX_NUM_SEQS:-12}"
      - --max-num-batched-tokens
      - "${QWEN3_EMBEDDING_MAX_NUM_BATCHED_TOKENS:-16384}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck: *vllm-healthcheck

  reranker:
    <<: *vllm-common
    container_name: carrel-reranker
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${QWEN3_RERANKER_PORT:-8102}:8000"
    volumes:
      - "${QWEN3_RERANKER_MODEL_PATH:-../../models/Qwen3-Reranker-0.6B}:/models/Qwen3-Reranker-0.6B:ro"
      - "${QWEN3_RERANKER_TEMPLATE_PATH:-./assets/qwen3_reranker.jinja}:/templates/qwen3_reranker.jinja:ro"
    command:
      - vllm
      - serve
      - /models/Qwen3-Reranker-0.6B
      - --served-model-name
      - qwen3-reranker-0.6b
      - --runner
      - pooling
      - --hf-overrides
      - '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /templates/qwen3_reranker.jinja
      - --dtype
      - "${QWEN3_RERANKER_DTYPE:-bfloat16}"
      - --gpu-memory-utilization
      - "${QWEN3_RERANKER_GPU_MEMORY_UTILIZATION:-0.05}"
      - --max-model-len
      - "${QWEN3_RERANKER_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${QWEN3_RERANKER_MAX_NUM_SEQS:-12}"
      - --max-num-batched-tokens
      - "${QWEN3_RERANKER_MAX_NUM_BATCHED_TOKENS:-24576}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck: *vllm-healthcheck

  vl-embedding:
    <<: *vllm-common
    container_name: carrel-vl-embedding
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${QWEN3_VL_EMBEDDING_PORT:-8103}:8000"
    volumes:
      - "${QWEN3_VL_EMBEDDING_MODEL_PATH:-../../models/Qwen3-VL-Embedding-2B}:/models/Qwen3-VL-Embedding-2B:ro"
      - "${RAG_MEDIA_PATH:-../../runtime/media}:/media:ro"
    command:
      - vllm
      - serve
      - /models/Qwen3-VL-Embedding-2B
      - --served-model-name
      - qwen3-vl-embedding-2b
      - --runner
      - pooling
      - --convert
      - embed
      - --hf-overrides
      - '{"is_matryoshka":true}'
      - --dtype
      - "${QWEN3_VL_EMBEDDING_DTYPE:-bfloat16}"
      - --gpu-memory-utilization
      - "${QWEN3_VL_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.12}"
      - --max-model-len
      - "${QWEN3_VL_EMBEDDING_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${QWEN3_VL_EMBEDDING_MAX_NUM_SEQS:-6}"
      - --max-num-batched-tokens
      - "${QWEN3_VL_EMBEDDING_MAX_NUM_BATCHED_TOKENS:-24576}"
      - --limit-mm-per-prompt
      - '{"image":1,"video":1}'
      - --mm-processor-cache-gb
      - "${QWEN3_VL_EMBEDDING_MM_PROCESSOR_CACHE_GB:-1}"
      - --mm-processor-kwargs
      - '{"max_pixels":${QWEN3_VL_EMBEDDING_MAX_PIXELS:-3686400}}'
      - --media-io-kwargs
      - '{"video":{"num_frames":${QWEN3_VL_EMBEDDING_MAX_FRAMES:-32}}}'
      - --allowed-local-media-path
      - /media
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck: *vllm-healthcheck

  vl-reranker:
    <<: *vllm-common
    container_name: carrel-vl-reranker
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${QWEN3_VL_RERANKER_PORT:-8104}:8000"
    volumes:
      - "${QWEN3_VL_RERANKER_MODEL_PATH:-../../models/Qwen3-VL-Reranker-2B}:/models/Qwen3-VL-Reranker-2B:ro"
      - "${QWEN3_VL_RERANKER_TEMPLATE_PATH:-./assets/qwen3_vl_reranker.jinja}:/templates/qwen3_vl_reranker.jinja:ro"
      - "${RAG_MEDIA_PATH:-../../runtime/media}:/media:ro"
    command:
      - vllm
      - serve
      - /models/Qwen3-VL-Reranker-2B
      - --served-model-name
      - qwen3-vl-reranker-2b
      - --runner
      - pooling
      - --trust-remote-code
      - --hf-overrides
      - '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /templates/qwen3_vl_reranker.jinja
      - --dtype
      - "${QWEN3_VL_RERANKER_DTYPE:-bfloat16}"
      - --gpu-memory-utilization
      - "${QWEN3_VL_RERANKER_GPU_MEMORY_UTILIZATION:-0.15}"
      - --max-model-len
      - "${QWEN3_VL_RERANKER_MAX_MODEL_LEN:-12288}"
      - --max-num-seqs
      - "${QWEN3_VL_RERANKER_MAX_NUM_SEQS:-6}"
      - --max-num-batched-tokens
      - "${QWEN3_VL_RERANKER_MAX_NUM_BATCHED_TOKENS:-36864}"
      - --limit-mm-per-prompt
      - '{"image":2,"video":1}'
      - --mm-processor-cache-gb
      - "${QWEN3_VL_RERANKER_MM_PROCESSOR_CACHE_GB:-1}"
      - --mm-processor-kwargs
      - '{"max_pixels":${QWEN3_VL_RERANKER_MAX_PIXELS:-3686400}}'
      - --media-io-kwargs
      - '{"video":{"num_frames":${QWEN3_VL_RERANKER_MAX_FRAMES:-32}}}'
      - --allowed-local-media-path
      - /media
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck: *vllm-healthcheck

  vlm:
    <<: *vllm-common
    container_name: carrel-vlm
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${QWEN3_VL_INSTRUCT_PORT:-8105}:8000"
    volumes:
      - "${QWEN3_VL_INSTRUCT_MODEL_PATH:-../../models/Qwen3-VL-8B-Instruct-FP8}:/models/Qwen3-VL-8B-Instruct-FP8:ro"
      - "${RAG_MEDIA_PATH:-../../runtime/media}:/media:ro"
    command:
      - vllm
      - serve
      - /models/Qwen3-VL-8B-Instruct-FP8
      - --served-model-name
      - qwen3-vl-8b-instruct-fp8
      - --dtype
      - "${QWEN3_VL_INSTRUCT_DTYPE:-bfloat16}"
      - --quantization
      - "${QWEN3_VL_INSTRUCT_QUANTIZATION:-fp8}"
      - --gpu-memory-utilization
      - "${QWEN3_VL_INSTRUCT_GPU_MEMORY_UTILIZATION:-0.18}"
      - --max-model-len
      - "${QWEN3_VL_INSTRUCT_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${QWEN3_VL_INSTRUCT_MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${QWEN3_VL_INSTRUCT_MAX_NUM_BATCHED_TOKENS:-16384}"
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      - --mm-processor-cache-gb
      - "${QWEN3_VL_INSTRUCT_MM_PROCESSOR_CACHE_GB:-1}"
      - --mm-processor-kwargs
      - '{"max_pixels":${QWEN3_VL_INSTRUCT_MAX_PIXELS:-3686400}}'
      - --allowed-local-media-path
      - /media
      - --enforce-eager
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck: *vllm-healthcheck
    stop_grace_period: 60s

  # ── parser ────────────────────────────────────────────────────────────────
  # Built from ./mineru. The entrypoint looks at the GPU it actually got,
  # picks the backend (vlm-engine on a capable GPU, pipeline otherwise or when
  # MINERU_BACKEND_POLICY says so), downloads the matching weights into
  # /models on first start and publishes its decision to /data/output/
  # carrel-mineru.json, which the pipeline reads when MINERU_BACKEND=auto.
  mineru:
    image: carrel-mineru:${MINERU_VERSION:-3.4.4}-${MINERU_FLAVOR:-gpu}
    build:
      context: ./mineru
      args:
        FLAVOR: ${MINERU_FLAVOR:-gpu}
        BASE_IMAGE: ${MINERU_BASE_IMAGE:-vllm/vllm-openai:v0.21.0}
        MINERU_VERSION: ${MINERU_VERSION:-3.4.4}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: carrel-mineru
    restart: unless-stopped
    ipc: host
    ports:
      - "${MODEL_BIND_ADDRESS:-127.0.0.1}:${MINERU_PORT:-8765}:8000"
    volumes:
      - "${MINERU_MODELS_PATH:-../../models/mineru}:/models:rw"
      - "${MINERU_OUTPUT_PATH:-../../runtime/mineru-output}:/data/output:rw"
    environment:
      CUDA_VISIBLE_DEVICES: "${MINERU_CUDA_VISIBLE_DEVICES:-0}"
      MINERU_BACKEND_POLICY: "${MINERU_BACKEND_POLICY:-auto}"
      MINERU_MODEL_SOURCE: "${MINERU_MODEL_SOURCE:-auto}"
      MINERU_VLM_MIN_VRAM_GB: "${MINERU_VLM_MIN_VRAM_GB:-8}"
      MINERU_VLM_MIN_COMPUTE: "${MINERU_VLM_MIN_COMPUTE:-7.0}"
      MINERU_VLM_TARGET_VRAM_GB: "${MINERU_VLM_TARGET_VRAM_GB:-7}"
      MINERU_GPU_MEMORY_UTILIZATION: "${MINERU_GPU_MEMORY_UTILIZATION:-}"
      MINERU_MAX_MODEL_LEN: "${MINERU_MAX_MODEL_LEN:-8192}"
      MINERU_MAX_NUM_SEQS: "${MINERU_MAX_NUM_SEQS:-16}"
      MINERU_MAX_NUM_BATCHED_TOKENS: "${MINERU_MAX_NUM_BATCHED_TOKENS:-16384}"
      MINERU_MM_PROCESSOR_CACHE_GB: "${MINERU_MM_PROCESSOR_CACHE_GB:-1}"
      MINERU_DTYPE: "${MINERU_DTYPE:-bfloat16}"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}"
      MINERU_PROCESSING_WINDOW_SIZE: "${MINERU_PROCESSING_WINDOW_SIZE:-64}"
      MINERU_API_OUTPUT_ROOT: /data/output
      OMP_NUM_THREADS: "${MINERU_OMP_NUM_THREADS:-4}"
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 8s
      retries: 20
      # The first start downloads the weights; keep the container out of the
      # "unhealthy" state while that happens.
      start_period: 900s
    networks:
      - carrel

  # ── stores ────────────────────────────────────────────────────────────────
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    container_name: carrel-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    environment:
      TZ: "${TZ:-UTC}"
      RUN_MODE: "${QDRANT_RUN_MODE:-production}"
      QDRANT__TELEMETRY_DISABLED: "${QDRANT_TELEMETRY_DISABLED:-true}"
    volumes:
      - "${QDRANT_DATA_PATH:-../../runtime/qdrant_data}:/qdrant/storage:rw"
    mem_limit: "${QDRANT_MEM_LIMIT:-4g}"
    mem_reservation: "${QDRANT_MEM_RESERVATION:-1g}"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200 OK'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - carrel

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.28-community}
    container_name: carrel-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (deploy.sh generates one)}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-1G}"
      NEO4J_dbms_usage__report_enabled: "${NEO4J_USAGE_REPORT_ENABLED:-false}"
    volumes:
      - "${NEO4J_DATA_PATH:-../../runtime/neo4j/data}:/data:rw"
      - "${NEO4J_LOGS_PATH:-../../runtime/neo4j/logs}:/logs:rw"
      - "${NEO4J_PLUGINS_PATH:-../../runtime/neo4j/plugins}:/plugins:rw"
      - "${NEO4J_IMPORT_PATH:-../../runtime/neo4j/import}:/var/lib/neo4j/import:rw"
    mem_limit: "${NEO4J_MEM_LIMIT:-4g}"
    mem_reservation: "${NEO4J_MEM_RESERVATION:-1g}"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - carrel

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.7.0}
    container_name: carrel-opensearch
    restart: unless-stopped
    ports:
      - "${OPENSEARCH_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"
    environment:
      # Single node, no security plugin, no performance-analyzer agent: the
      # keyword index lives on loopback and the built-in `cjk` analyzer needs
      # no extra plugin.
      discovery.type: single-node
      cluster.name: carrel
      node.name: carrel-opensearch
      network.host: 0.0.0.0
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_JAVA_HEAP:-1g} -Xmx${OPENSEARCH_JAVA_HEAP:-1g}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${OPENSEARCH_DATA_PATH:-../../runtime/opensearch/data}:/usr/share/opensearch/data:rw"
    mem_limit: "${OPENSEARCH_MEM_LIMIT:-3g}"
    mem_reservation: "${OPENSEARCH_MEM_RESERVATION:-1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          >/dev/null
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - carrel

networks:
  carrel:
    name: carrel
    driver: bridge
