[project]
name = "carrel"
version = "0.1.0"
description = "Carrel: Ontology-Augmented Generation for AI agents. Local knowledge-base ingestion pipeline, console and search service."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.90.0",
  "qdrant-client>=1.16.0,<1.18.0",
  "tiktoken>=0.11.0",
  "requests>=2.32.0",
  "openpyxl>=3.1.5",
  "Pillow>=11.0.0",
  "xlrd>=2.0.1",
  "lxml>=5.0.0",
  "neo4j>=5.28.0,<6.0.0",
  "opensearch-py>=2.8,<4",
  "pyarrow>=22.0.0,<23.0.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
# Original-resolution pictures and crops from PDFs in the search service
# (kb_search/images.py). PyMuPDF is AGPL-3.0 / commercial dual licensed; without
# it the service falls back to the parser's cached images and /health says so.
pdf-images = ["pymupdf>=1.24"]

[project.scripts]
# `kb` is the historical name used throughout the scripts and units; `carrel`
# is the same entry point.
kb = "kb_pipeline.cli:main"
carrel = "kb_pipeline.cli:main"

[tool.setuptools.package-data]
# The console's static files must ship with the package: an editable install
# finds them anyway, a plain `pip install ./app` would 404 on StaticFiles.
kb_server = ["static/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kb_pipeline*", "kb_server*", "kb_search*"]

[tool.pytest.ini_options]
# Plain `pytest` runs the whole suite; no .pytest_cache in the repo.
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
